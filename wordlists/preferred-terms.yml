# --- Technical terms (specific casing or form) ---

technical:
  - preferred: machine learning
    avoid: [Machine Learning, Machine learning]
  - preferred: ML
    avoid: [ml]

# --- Compound words (preferred form) ---

compounds:
  - preferred: backend
    avoid: [back-end, back end]
  - preferred: bitstream
    avoid: [bit stream, bit-stream]
  - preferred: changelog
    avoid: [change log, change-log]
  - preferred: checkpoint
    avoid: [check-point, check point]
  - preferred: codename
    avoid: [code-name, code name]
  - preferred: dataset
    avoid: [data-set, data set]
  - preferred: datatype
    avoid: [data-type, data type]
  - preferred: filesystem
    avoid: [file-system, file system]
  - preferred: hostname
    avoid: [host-name, host name]
  - preferred: keyframe
    avoid: [key frame, key-frame]
  - preferred: namespace
    avoid: [name-space, name space]
  - preferred: nontrivial
    avoid: [non-trivial, non trivial]
  - preferred: pretrain
    avoid: [pre-train, pre train]
  - preferred: reuse
    avoid: [re-use, re use]
  - preferred: runtime
    avoid: [run-time, run time]
  - preferred: toolchain
    avoid: [tool-chain, tool chain]
  - preferred: walkthrough
    avoid: [walk-through, walk through]
  - preferred: whitepaper
    avoid: [white-paper, white paper]
  - preferred: whitespace
    avoid: [white-space, white space]
  - preferred: workgroup
    avoid: [work-group, work group]

# --- Inclusive language ---

inclusive:
  - preferred: allowlist
    avoid: [whitelist]
  - preferred: denylist
    avoid: [blacklist]
  - preferred: primary
    avoid: [master]
    context: "In non-git contexts"
  - preferred: replica
    avoid: [slave]
  - preferred: confidence check
    avoid: [sanity check]

