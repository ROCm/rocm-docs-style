StylesPath = styles
MinAlertLevel = warning
Packages = Google, Microsoft

# This docs set is authored in both Markdown and reStructuredText, so the
# shared rule configuration below applies to both via a combined glob
# section. Vale merges every section whose glob matches a given file, with
# later sections overriding earlier ones key-by-key for that file — so the
# two small format-specific sections further down ([*.md] and [*.rst]) only
# need to carry the handful of settings that legitimately differ by format
# (the CORE-008/CORE-008-MD split); everything else here applies to both
# without duplication. This has been verified empirically: a shared
# `BasedOnStyles` declared here reaches both .md and .rst files, and a
# format-specific section's own overrides (e.g. disabling one heading rule)
# apply only to that format without needing to restate BasedOnStyles.
[*.{md,rst}]
BasedOnStyles = Vale, Google, Microsoft, ROCm

# ROCm/AMD product and library names (e.g. ROCm, hipBLAS, MIOpen) are not in
# standard dictionaries, and this repo does not ship a custom spelling
# vocabulary. Casing and spelling of these names is enforced instead by the
# ROCm.SPELL-* rules, so the generic spellchecker is disabled to avoid noisy
# false positives.
Vale.Spelling = NO

# ROCm.CORE-008 (or, for Markdown, its companion ROCm.CORE-008-MD — see
# the [*.md]/[*.rst] sections below) owns sentence-case heading
# capitalization for this docs set (with its own exceptions list for
# product/library names), so the generic heading-case checks are redundant
# here.
Google.Headings = NO
Microsoft.Headings = NO

# ROCm.CORE-018/CORE-020 supersede these two Google checks with ROCm/AMD-aware
# detection logic (extended acronym exceptions, and unit-of-measure handling),
# so the generic versions are disabled to avoid duplicate/conflicting alerts.
Google.Acronyms = NO
Google.Units = NO

# Google.Colons was superseded by ROCm.CORE-019, now removed: CORE-019
# enforced a colon-capitalization rule the current ROCm style guide no
# longer states, and directly contradicted the guide's "Description lists"
# section. Left disabled here rather than re-enabled — Google.Colons's own
# behavior (flag any capital after ": ", including known proper nouns like
# "ROCm") is likely just as wrong against the current guide as CORE-019 was.
Google.Colons = NO

# --- Google/Microsoft deconfliction (ROCm > Google > Microsoft) ---
#
# Where a Google and a Microsoft check cover the same topic, the less
# extensive one is disabled. Ties and cases where Google is broader default
# to keeping Google (Microsoft is a gap-filler); where Microsoft is
# demonstrably broader, Google is disabled instead (justified per-rule below).
# Two Microsoft heading checks are disabled outright because they directly
# contradict an existing ROCm rule, independent of any Google equivalent.

# Microsoft.Contractions covers the same substitution list as Google's, plus
# a reverse contracted->expanded swap before end punctuation (e.g. "it's." ->
# "it is."), avoiding an awkward contraction at a sentence boundary.
Google.Contractions = NO

# Microsoft.Dashes matches the same two-sided-space defect as Google.EmDash,
# plus the one-sided variants (space on only one side), which Google's regex
# misses.
Google.EmDash = NO

# Microsoft.FirstPerson matches the same first-person tokens as Google's,
# plus the contracted forms I'd/I'll/I've, which Google's token list omits.
Google.FirstPerson = NO

# Microsoft.Foreign covers the same e.g./i.e. substitutions as Google.Latin,
# plus viz./ergo, which Google does not flag.
Google.Latin = NO

# Microsoft.HeadingPunctuation flags the same trailing-period case as
# Google's, plus trailing "?"/"!" in headings, which Google's period-only
# regex misses.
Google.HeadingPunctuation = NO

# Microsoft.Plurals flags the same "(s)" plural-marker case as
# Google.OptionalPlurals, plus "(es)", which Google's regex doesn't match.
Google.OptionalPlurals = NO

# Parenthetical plurals -- "(s)"/"(es)" -- are legitimate in technical docs
# (e.g. "Invocation(s)" when a field may hold one or more items), so disable
# Microsoft.Plurals too: with Google.OptionalPlurals already off above, it was
# the rule actually firing on those cases.
Microsoft.Plurals = NO

# Microsoft.Quotes flags the same straight-quote case as Google's, plus
# curly/smart quotes, which Google's regex doesn't match.
Google.Quotes = NO

# The following Microsoft checks are functionally identical to (or narrower
# than) their Google counterpart, so Google's version is kept and Microsoft's
# is disabled to avoid duplicate/conflicting alerts:
#   - AMPM: functionally identical to Google.AMPM.
#   - DateFormat/DateOrder: Google.DateFormat covers two malformed-date
#     shapes; Microsoft.DateOrder's only edge (2-digit years) doesn't
#     outweigh that broader coverage.
#   - Ellipses: byte-identical to Google.Ellipses.
#   - Gender: Google.Gender has an extra token, "(s)he".
#   - GenderBias: near-identical; Google's "mankind" replacement offers an
#     extra alternative.
#   - Hyphens: identical regex/action to Google.LyHyphens; only severity/link
#     differ.
#   - OxfordComma: Google.OxfordComma's regex is looser (no sentence-final
#     punctuation requirement), so it catches more instances.
#   - Passive: byte-identical to Google.Passive.
#   - Semicolon: identical trigger to Google.Semicolons, same level.
#   - Spacing: byte-identical to Google.Spacing.
#   - We: byte-identical to Google.We.
Microsoft.AMPM = NO
Microsoft.DateFormat = NO
Microsoft.DateOrder = NO
Microsoft.Ellipses = NO
Microsoft.Gender = NO
Microsoft.GenderBias = NO
Microsoft.Hyphens = NO
Microsoft.OxfordComma = NO
Microsoft.Passive = NO
Microsoft.Semicolon = NO
Microsoft.Spacing = NO
Microsoft.We = NO

# Microsoft.Acronyms is identical detection logic to Google.Acronyms (see
# above), which ROCm.CORE-018 already supersedes.
Microsoft.Acronyms = NO

# Microsoft.HeadingAcronyms conflicts with ROCm.CORE-008's heading-exceptions
# policy, which explicitly permits dozens of acronyms (ROCm, HIP, GPU, SDK,
# AMD, ...) in headings.
Microsoft.HeadingAcronyms = NO

# Microsoft.HeadingColons wants to capitalize the word after a colon in
# headings; ROCm.CORE-008 enforces sentence case (lowercase after a colon
# unless a proper noun), which directly contradicts it.
Microsoft.HeadingColons = NO

# ROCm.CORE-024 forks Google.WordList's swap list, minus entries that don't
# suit this docs set (the "application: app" and "disabled" entries, the "CLI"
# entry, and everything that only serves Google's own products). See
# CORE-024.yml for the full list and the maintenance note on keeping the fork
# in sync with upstream changes to Google's word list.
Google.WordList = NO

# Google.WordListCase is the case-insensitive twin of Google.WordList: the same
# swap list, matched without regard to case. Disabling only Google.WordList
# left it running, so every ROCm.CORE-024 alert was reported a second time on
# the identical span (251 duplicate pairs in the first scan of real docs), and
# unlike CORE-024 it still carried the Google-product entries that were
# trimmed out above.
Google.WordListCase = NO

# Google.Will flags every occurrence of the bare token "will" with no sense
# disambiguation: a genuine future event ("will be fixed in a future release"),
# which Google's own tense guidance allows, is indistinguishable by regex from a
# present-tense candidate ("CRIU will fail"), and the check is case-insensitive
# so it also hits the name "Will" and a sentence-initial "Will". Telling those
# apart needs the sentence read, which belongs to the LLM review tier rather
# than a mechanical check, so it is disabled here.
Google.Will = NO

# Microsoft.Adverbs is a stock list of 264 adverbs whose own message hedges
# ("Remove X if it's not important to the meaning"). Most are manner and
# frequency adverbs that carry real technical meaning in this docs set
# ("silently", "randomly", "gracefully"), and "easily" is already owned by
# ROCm.SPELL-009, so it double-reported. Google has no equivalent rule.
# ROCm.CORE-026 keeps just the pure intensifiers (very, quite, really,
# extremely, fairly) and replaces it.
Microsoft.Adverbs = NO

# Microsoft.Avoid (error level) lists "backend" as a word to avoid, directly
# contradicting ROCm policy, where "backend" is the PREFERRED compound
# (rules/02-spelling-terminology.md; SPELL-004 flags "back-end"/"back end").
# It was the source of ~92% of Microsoft.Avoid alerts in the first scan of real
# docs and failed CI on the correct spelling. ROCm outranks Microsoft, so
# ROCm.CORE-025 replaces it: the same list minus "backend".
Microsoft.Avoid = NO

# Microsoft.Contractions is deliberately ENABLED. Contractions are established
# ROCm style (including in headings, e.g. "What's new"), and Google's own
# Contractions check, which would say the same, is disabled above in favor of
# Microsoft's broader version. A baseline check that merely looks unowned in
# this file is not noise; do not disable it to reduce alert volume.

# --- Checks suspended after review of real documentation ---
#
# Each check below is OFF on purpose and is listed, with its reason and whether
# the LLM review tier covers it, in rules/09-suspended-and-delegated.md. To
# bring one back, delete its line here; nothing else needs to change.

# Microsoft.UIVerbs asks for "select" instead of "click" everywhere. Microsoft's
# own guide allows "click" for a literal mouse action, and the check cannot tell
# one from the other ("Single click to run interaction models"). Whether the
# verb fits needs the sentence read, which belongs to the LLM review tier.
Microsoft.UIVerbs = NO

# Microsoft.Quotes wants punctuation inside quotation marks. Technical
# documentation quotes exactly what is typed, so moving a comma or period inside
# the quotes changes the quoted value.
Microsoft.Quotes = NO

# Microsoft.GeneralURL says to use "address" instead of "URL" for a general
# audience. This docs set is written for technical readers, so "URL" is correct.
Microsoft.GeneralURL = NO

# Microsoft.Terms prefers "numeric" over "numerical". The two are not
# interchangeable ("numerical methods", "numerical behavior" are correct).
Microsoft.Terms = NO

# Microsoft.Suspended flags "pre- and post-" (suspended hyphens) unless space is
# limited. No ROCm rule asks for this and the form is ordinary in technical
# prose.
Microsoft.Suspended = NO

# Microsoft.Foreign replaced Google.Latin (see above) for "e.g." and "i.e.", but
# those abbreviations are allowed in this docs set. Disabling it also drops its
# "viz." and "ergo" substitutions, which are rare enough not to matter.
Microsoft.Foreign = NO

# Google.LyHyphens matches any word ending in "-ly" followed by a hyphen, not
# just adverbs, so it flags "multiply-add" (a fused operation) and the "only" in
# "only-if-needed". No ROCm rule sets a policy on -ly hyphens, so it is off
# rather than forked.
Google.LyHyphens = NO

# Vale.Repetition flags any repeated word. In real documentation almost every
# hit was a false positive: a repeated personal name ("Si Si"), a version number
# ("7.x.x"), or the "to" inside "in order to". It is built in, so it cannot be
# tuned. The cost of turning it off is that a real typo such as "the the" is no
# longer caught mechanically.
Vale.Repetition = NO

# ROCm.CORE-022 (no "v" before a version number) is suspended. Standard names
# such as "Inception v3" and "PKCS#1 v1.5" and several AMD releases use the
# prefix, so no single rule is right for all of them. The rule file is kept so it
# can be re-enabled without being rewritten.
ROCm.CORE-022 = NO

# --- Format-specific heading-case enforcement ---
#
# ROCm.CORE-008 (`scope: heading`) is reliable for .rst but not Markdown:
# Vale also treats a CommonMark Setext heading — a line of prose immediately
# followed by a bare `---`/`===` divider with no blank line — as a real
# heading, which misfires on authors who meant that divider as a thematic
# break. This docs set's Markdown headings are always ATX (`#`), so for
# Markdown, ROCm.CORE-008-MD (in styles/ROCm/CORE-008-MD.yml) replaces it
# with a check anchored to lines that structurally start with `#`. Each
# format therefore runs exactly one of the two rules, never both.
[*.md]
ROCm.CORE-008 = NO

[*.rst]
ROCm.CORE-008-MD = NO

# --- LICENSE exception ---
#
# LICENSE files are boilerplate legal text, not authored documentation, and
# shouldn't be run through the prose/style rule set. A more specific glob
# section fully overrides BasedOnStyles for matching files rather than
# merging with [*.{md,rst}], so this disables all checks for LICENSE/
# LICENSE.md/LICENSE.rst (and lowercase variants) without affecting anything
# else. This has been verified empirically to still take precedence with the
# shared-section layout above.
# Each name is listed twice, bare and "**/"-prefixed, because the bare form
# only matches the file at the lint invocation's root — a nested path such as
# "docs/LICENSE.md" needs the "**/" form to match at any depth.
[{LICENSE,LICENSE.md,LICENSE.rst,license,license.md,license.rst,**/LICENSE,**/LICENSE.md,**/LICENSE.rst,**/license,**/license.md,**/license.rst}]
BasedOnStyles =
