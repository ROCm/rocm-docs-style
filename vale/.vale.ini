StylesPath = styles
MinAlertLevel = warning
Packages = Google, Microsoft

[*.md]
BasedOnStyles = Vale, Google, Microsoft, ROCm

# ROCm/AMD product and library names (e.g. ROCm, hipBLAS, MIOpen) are not in
# standard dictionaries, and this repo does not ship a custom spelling
# vocabulary. Casing and spelling of these names is enforced instead by the
# ROCm.SPELL-* rules, so the generic spellchecker is disabled to avoid noisy
# false positives.
Vale.Spelling = NO

# ROCm.CORE-008 owns sentence-case heading capitalization for this docs set
# (with its own exceptions list for product/library names), so the generic
# heading-case checks are redundant here.
Google.Headings = NO
Microsoft.Headings = NO

# ROCm.CORE-018/CORE-019/CORE-020 supersede these three Google checks with
# ROCm/AMD-aware detection logic (extended acronym exceptions, proper-noun
# aware colon casing, and unit-of-measure handling), so the generic versions
# are disabled to avoid duplicate/conflicting alerts.
Google.Acronyms = NO
Google.Colons = NO
Google.Units = NO

# --- Google/Microsoft deconfliction (ROCm > Google > Microsoft) ---
#
# Where a Google and a Microsoft check cover the same topic, the less
# extensive one is disabled. Ties and cases where Google is broader default
# to keeping Google (Microsoft is a gap-filler); where Microsoft is
# demonstrably broader, Google is disabled instead (justified per-rule below).
# Two Microsoft heading checks are disabled outright because they directly
# contradict an existing ROCm rule, independent of any Google equivalent.

# Microsoft.Contractions covers the same substitution list as Google's, plus
# a reverse contracted->expanded swap before end punctuation (e.g. "it's." ->
# "it is."), avoiding an awkward contraction at a sentence boundary.
Google.Contractions = NO

# Microsoft.Dashes matches the same two-sided-space defect as Google.EmDash,
# plus the one-sided variants (space on only one side), which Google's regex
# misses.
Google.EmDash = NO

# Microsoft.FirstPerson matches the same first-person tokens as Google's,
# plus the contracted forms I'd/I'll/I've, which Google's token list omits.
Google.FirstPerson = NO

# Microsoft.Foreign covers the same e.g./i.e. substitutions as Google.Latin,
# plus viz./ergo, which Google does not flag.
Google.Latin = NO

# Microsoft.HeadingPunctuation flags the same trailing-period case as
# Google's, plus trailing "?"/"!" in headings, which Google's period-only
# regex misses.
Google.HeadingPunctuation = NO

# Microsoft.Plurals flags the same "(s)" plural-marker case as
# Google.OptionalPlurals, plus "(es)", which Google's regex doesn't match.
Google.OptionalPlurals = NO

# Microsoft.Quotes flags the same straight-quote case as Google's, plus
# curly/smart quotes, which Google's regex doesn't match.
Google.Quotes = NO

# The following Microsoft checks are functionally identical to (or narrower
# than) their Google counterpart, so Google's version is kept and Microsoft's
# is disabled to avoid duplicate/conflicting alerts:
#   - AMPM: functionally identical to Google.AMPM.
#   - DateFormat/DateOrder: Google.DateFormat covers two malformed-date
#     shapes; Microsoft.DateOrder's only edge (2-digit years) doesn't
#     outweigh that broader coverage.
#   - Ellipses: byte-identical to Google.Ellipses.
#   - Gender: Google.Gender has an extra token, "(s)he".
#   - GenderBias: near-identical; Google's "mankind" replacement offers an
#     extra alternative.
#   - Hyphens: identical regex/action to Google.LyHyphens; only severity/link
#     differ.
#   - OxfordComma: Google.OxfordComma's regex is looser (no sentence-final
#     punctuation requirement), so it catches more instances.
#   - Passive: byte-identical to Google.Passive.
#   - Semicolon: identical trigger to Google.Semicolons, same level.
#   - Spacing: byte-identical to Google.Spacing.
#   - We: byte-identical to Google.We.
Microsoft.AMPM = NO
Microsoft.DateFormat = NO
Microsoft.DateOrder = NO
Microsoft.Ellipses = NO
Microsoft.Gender = NO
Microsoft.GenderBias = NO
Microsoft.Hyphens = NO
Microsoft.OxfordComma = NO
Microsoft.Passive = NO
Microsoft.Semicolon = NO
Microsoft.Spacing = NO
Microsoft.We = NO

# Microsoft.Acronyms is identical detection logic to Google.Acronyms (see
# above), which ROCm.CORE-018 already supersedes.
Microsoft.Acronyms = NO

# Microsoft.HeadingAcronyms conflicts with ROCm.CORE-008's heading-exceptions
# policy, which explicitly permits dozens of acronyms (ROCm, HIP, GPU, SDK,
# AMD, ...) in headings.
Microsoft.HeadingAcronyms = NO

# Microsoft.HeadingColons wants to capitalize the word after a colon in
# headings; ROCm.CORE-008 enforces sentence case (lowercase after a colon
# unless a proper noun), which directly contradicts it.
Microsoft.HeadingColons = NO

# --- LICENSE exception ---
#
# LICENSE files are boilerplate legal text, not authored documentation, and
# shouldn't be run through the prose/style rule set. A more specific glob
# section fully overrides BasedOnStyles for matching files rather than
# merging with [*.md], so this disables all checks for LICENSE/LICENSE.md/
# LICENSE.rst (and lowercase variants) without affecting anything else.
[{LICENSE,LICENSE.md,LICENSE.rst,license,license.md,license.rst}]
BasedOnStyles =
