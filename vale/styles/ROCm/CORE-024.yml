# CORE-024 — Word choice (supersedes Google.WordList) (warning)
#
# Derived from Google.WordList's substitution list, trimmed to the entries
# that make sense for a ROCm/GPU documentation set. Removed:
#   - "application: app" and "disabled?: turn off|off" (this repo's own docs
#     use "disabled"/"disable" routinely, e.g. to describe disabled Vale
#     checks)
#   - "CLI: command-line tool": wrong for the ROCm CLI product name and for
#     any heading or prose that names a CLI
#   - every entry that exists only to serve Google's own products and
#     platforms: Google Cloud Platform and its terminology ("Cloud",
#     "Container Engine", "curated roles", "ephemeral/static/network IP
#     address", "firewalls", "Developers Console" and the API console/key
#     entries), Google account/service names ("Google account(s)",
#     "Googling", "Google I/O", "API explorer", "omnibox"), and Android/mobile
#     UI terminology ("Android", "Android device", ".apk", "action bar",
#     "overview screen", "tap & hold", "long press", "tablet",
#     "cell/smart phone", "cellular data/network", and "touch: tap"). The last
#     of those flagged every ordinary use of the word "touch".
# Everything else is copied verbatim from Google.WordList.
#
# MAINTENANCE: this is a manual fork, not a live reference. Google.WordList
# is fetched via `vale sync` (vale/styles/Google/WordList.yml) and can change
# upstream at any time; those changes are NOT picked up here automatically.
# When Google's word list is updated, diff it against this file's swap list
# and port over only the generic additions; skip entries that are specific to
# Google products, Google Cloud, or Android/mobile UI, and skip the entries
# listed as removed above.
extends: substitution
message: "CORE-024: Use '%s' instead of '%s'."
link: "https://developers.google.com/style/word-list"
level: warning
ignorecase: false
action:
  name: replace
swap:
  "(?:e-mail|Email|E-mail)": email
  "(?:file ?path|path ?name)": path
  "(?:kill|terminate|abort)": stop|exit|cancel|end
  "(?:OAuth ?2|Oauth)": OAuth 2.0
  "(?:ok|Okay)": OK|okay
  "(?:WiFi|wifi)": Wi-Fi
  '3\-D': 3D
  "un(?:check|select)": clear
  above: preceding
  account name: username
  admin: administrator
  Ajax: AJAX
  a\.k\.a|aka: or|also known as
  approx\.: approximately
  authN: authentication
  authZ: authorization
  autoupdate: automatically update
  chapter: documents|pages|sections
  check box: checkbox
  click on: click|click in
  content type: media type
  data are: data is
  fewer data: less data
  file name: filename
  functionality: capability|feature
  grayed-out: unavailable
  HTTPs: HTTPS
  in order to: to
  ingest: import|load
  k8s: Kubernetes
  open-source: open source
  regex: regular expression
  SHA1: SHA-1|HAS-SHA1
  sign into: sign in to
  sign-?on: single sign-on
  stylesheet: style sheet
  synch: sync
  tablename: table name
  url: URL
  vs\.: versus
  World Wide Web: web
