# Trademark modification — No modification of AMD trademarks (error)
# Reuses wordlists/amd-trademarks.yml (marks). Flags possessive ("AMD's",
# "EPYC's"), pluralization ("EPYCs"), and hyphenated combinations
# ("AMD-EPYC", "AMD-optimized", "AMD-based") of AMD marks.
# The AMD note in the wordlist: "Do not use possessively (AMD's). Do not
# hyphenate or combine."
# Known product names that are themselves legitimately hyphenated
# "AMD-X" (not a modification of the AMD mark) are excluded via a negative
# lookahead in the hyphenated-combination token below. Vale's built-in
# `exceptions:` field is broken for `existence`-type rules (errata-ai/vale#894,
# #213), the same limitation CORE-020 works around, so the exclusion has to
# live in the regex instead.
extends: existence
message: "Do not modify AMD trademarks (no possessive, plural, or hyphenated combination): '%s'."
level: error
nonword: true
ignorecase: false
tokens:
  # Possessive forms of AMD and AMD marks.
  - "AMD's"
  - "(?:EPYC|Ryzen|Instinct|Radeon|Threadripper|ROCm)'s"
  # Pluralized marks (mark + lowercase s).
  - '\b(?:EPYCs|Ryzens|Instincts|Radeons|Threadrippers)\b'
  # Hyphenated combinations beginning with AMD, excluding known product names.
  - '\bAMD-(?!XIO\b)[A-Za-z]+'
