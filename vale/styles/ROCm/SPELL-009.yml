# SPELL-009 — Ambiguous / non-translatable words (warning)
#
# Most entries in the source word list are context-dependent (e.g. "modify"
# can be fine, and "first"/"only" are often ambiguous only in certain
# phrasings). This rule converts only the high-confidence, always-discouraged
# words as flags. Words that need to be judged in context ("modify", "via",
# "first", "only") are intentionally left out of this mechanical check.
# Several entries here overlap Google.Will/Google.Acronyms etc.; the ROCm rule is
# emitted first per BasedOnStyles ordering.
#
# "in order to" is intentionally NOT listed: ROCm.CORE-024 already owns that
# substitution ("in order to" -> "to") and reports it with the replacement, so
# listing it here too produced a second alert on the identical span.
#
# Note: the `e.g.` and `i.e.` tokens below do not currently match anything.
# With `nonword: false` Vale wraps each token in `\b`, and a word boundary
# can't follow a trailing ".". Microsoft.Foreign is what actually flags those
# two, so they are left in place as documentation of the policy.
extends: existence
message: "'%s' is discouraged — see the Google word list for a clearer alternative."
level: warning
ignorecase: true
nonword: false
tokens:
  - comprise
  - comprises
  - comprised
  - desire
  - 'e\.g\.'
  - 'i\.e\.'
  - leverage
  - leverages
  - leveraging
  - please
  - simply
  - simple
  - easily
  - easy
  - obviously
  - utilize
