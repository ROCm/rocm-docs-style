# SPELL-003 — ROCm product and library name casing (error)
#
# This rule is a standalone substitution swap list: it maps common miscasings
# of ROCm product/library names (matching the canonical casing in
# wordlists/preferred-terms.yml's rocm-components list) to the correct form,
# with an explicit SPELL-003 message. There is no backing Vale vocabulary or
# Vale.Terms check — this swap list is the sole enforcement mechanism.
# nonword + case-sensitive matching: only the wrong casings below match; the
# correct casing (e.g. rocBLAS) is left untouched.
#
# Every key is wrapped in the same boundary guard, so a name only matches when
# it stands alone as a word in prose:
#
#   leading   (?<![\w/.-])      not preceded by a word character, "/", "." or "-"
#   trailing  (?![\w/]|[-.]\w)  not followed by a word character, "/", or a
#                               "-"/"." that continues into another word
#
# This keeps the rule off things that are literal identifiers rather than a
# miscasing of the brand name:
#   - a longer product name that merely contains the key: "HIPBLASLt" is
#     hipBLASLt, a distinct library, not "hipBLAS" miscased
#   - kebab-case repo/package/tool slugs: "rocm-examples", "migraphx-driver",
#     "rocprofiler-compute", "rocprofiler-systems" (the last two are the
#     package names for ROCm Compute Profiler and ROCm Systems Profiler,
#     distinct from the ROCProfiler library). The old per-key lookaheads for
#     these are subsumed by the shared trailing guard
#   - environment variables: "ROCM_PATH", "MIGRAPHX_SET_GEMM_PROVIDER",
#     "ASAN_OPTIONS"
#   - path segments, filenames, and domains: "/opt/rocm/bin", "rocm/",
#     "rocm.conf", "docs.rocm.com"
# A name followed by sentence punctuation or a space still matches, so a real
# miscasing such as "tested with rocm 6.0" or "build migraphx." is still caught.
#
# The ASAN and ROCPD keys previously used a letter-only boundary because both
# are short substrings of unrelated real words (ASAN is the tail of "KASAN",
# Kernel AddressSanitizer). The shared guard covers that too (a preceding "K"
# is a word character) and additionally skips "ASAN_OPTIONS".
extends: substitution
message: "SPELL-003: Use the exact ROCm name casing '%s' instead of '%s'."
level: error
ignorecase: false
nonword: true
swap:
  '(?<![\w/.-])(?:ROCM|rocm|Rocm)(?![\w/]|[-.]\w)': ROCm
  '(?<![\w/.-])(?:HipBLAS|HIPBLAS|hipblas)(?![\w/]|[-.]\w)': hipBLAS
  '(?<![\w/.-])(?:RocBLAS|ROCBLAS|rocblas)(?![\w/]|[-.]\w)': rocBLAS
  '(?<![\w/.-])(?:miopen|MIOPEN|Miopen)(?![\w/]|[-.]\w)': MIOpen
  '(?<![\w/.-])(?:RocFFT|ROCFFT|rocfft)(?![\w/]|[-.]\w)': rocFFT
  '(?<![\w/.-])(?:HipSPARSE|hipsparse)(?![\w/]|[-.]\w)': hipSPARSE
  '(?<![\w/.-])(?:RocSOLVER|rocsolver)(?![\w/]|[-.]\w)': rocSOLVER
  '(?<![\w/.-])(?:migraphx|MIGRAPHX)(?![\w/]|[-.]\w)': MIGraphX
  '(?<![\w/.-])(?:rocprofiler|ROCPROFILER)(?![\w/]|[-.]\w)': ROCProfiler
  '(?<![\w/.-])(?:RocPRIM|rocprim)(?![\w/]|[-.]\w)': rocPRIM
  '(?<![\w/.-])(?:RocRAND|rocrand)(?![\w/]|[-.]\w)': rocRAND
  '(?<![\w/.-])(?:RocThrust|rocthrust)(?![\w/]|[-.]\w)': rocThrust
  '(?<![\w/.-])(?:rocalution|ROCALUTION)(?![\w/]|[-.]\w)': rocALUTION
  '(?<![\w/.-])(?:VLLM|Vllm)(?![\w/]|[-.]\w)': vLLM
  '(?<![\w/.-])ASAN(?![\w/]|[-.]\w)': ASan
  '(?<![\w/.-])(?:ROCPD|ROCpd)(?![\w/]|[-.]\w)': rocpd
