# CORE-019 — Colon capitalization (supersedes Google.Colons)
#
# Identical detection logic to Google.Colons (same regex shape, same
# message/level) but with an added negative lookahead so the check doesn't
# fire when the word right after the colon is a known proper noun (product
# name, library, trademark, or third-party tool) rather than an ordinary
# capitalized word that violates sentence case.
#
# This can't be done via a shared vocabulary/allow-list mechanism: Vale's
# built-in `exceptions:` field is broken for `existence`-type rules
# (errata-ai/vale#894, #213), and an allow-list entry for "ROCm" specifically
# would have unwanted side effects on other casing checks elsewhere in this
# style set. The exception has to live in this rule's regex instead.
#
# The exception list below is the first word of every proper noun already
# treated as a fixed-casing "known name" elsewhere in this repo:
#   - wordlists/preferred-terms.yml (rocm-libs, third-party)
#   - wordlists/amd-trademarks.yml (mark)
#   - wordlists/third-party-trademarks.yml (mark)
# Only names whose first letter is already uppercase are listed — anything
# starting lowercase (hipBLAS, rocFFT, cuDNN, vLLM, ...) never matches
# Google.Colons' `:\s[A-Z]` token in the first place.
extends: existence
message: "CORE-019: '%s' should be in lowercase."
link: 'https://developers.google.com/style/colons'
nonword: true
level: warning
scope: sentence
tokens:
  - '(?<!:[^ ]+?):\s(?!(?:Advanced|AGESA|Alveo|AlmaLinux|AMD|AMDMIGraphX|Arm|BabelStream|CDNA|CentOS|CMake|ConnectX|Crossfire|CUDA|CuPy|Debian|DeepSeek|DeepSpeed|Docker|EPYC|FlashAttention|GFortran|GitHub|Google|HIP|HIPify|Infinity|InfiniBand|Intel|IntelliSense|JAX|Jupyter|Keras|Kubernetes|Linux|LLVM|Microsoft|MIGraphX|MIOpen|MIVisionX|NumPy|NVIDIA|NVLink|ONNX|OpenCL|OpenCV|OpenGL|OpenMP|OpenMPI|OpenSSL|PCIe|Python|PyTorch|RCCL|RDNA|Radeon|Red|RHEL|ROCclr|ROCdbgapi|ROCgdb|ROCm|ROCmCC|ROCProfiler|ROCTracer|Ryzen|SGLang|Silo|SimNow|SLURM|StoreMi|Tensile|TensorBoard|TensorFlow|TensorRT|Threadripper|TorchMIGraphX|Ubuntu|Valgrind|Versal|Vitis|Vivado|VMware|Vulkan|Windows|Xilinx|Zynq)\b)[A-Z]'
