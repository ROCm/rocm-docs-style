# CORE-020 — Units of measure (supersedes Google.Units)
#
# Identical detection logic to Google.Units (same token shapes, same
# message/level) but the bare-"B" (bytes, no metric prefix) token gets two
# negative lookbehinds so the check doesn't fire on LLM model-name
# parameter-count suffixes, which use a bare "B" the same way Google.Units
# expects a byte count to be written:
#   - GPT-OSS-20B      -> the digits are hyphen-joined to the model name
#   - Llama 3 405B     -> the digits are preceded by another bare number
#                         (the model's version number) and a space
#
# This can't be done via `exceptions:`: it's non-functional for
# `existence`-type rules (errata-ai/vale#894, #213), the same limitation
# Google.Colons had (see CORE-019's removal note). The exclusion has to
# live in the token regex.
#
# Scope note: this only covers the two shapes above. A model name written
# as "Name NNNB" with no hyphen and no version number in between (e.g.
# "Llama 70B") is not excluded and will still be flagged -- narrowing that
# further risks swallowing genuine byte-count typos like "Buffer 20B".
#
# The kB/MB/GB/TB token doesn't collide with LLM parameter-count naming (no
# ROCm docs use "20MB" or similar to mean a parameter count), so it keeps
# flagging real missing-space issues (e.g., "20GB" -> "20 GB").
#
# The time-unit token's bare "s" gets a negative lookahead for a following
# "t" at a word boundary, so the ordinal suffix "-st" ("1st", "21st", "31st")
# is not read as "1s"/"21s" seconds. That collision made every such ordinal
# double-report alongside Google.Ordinal. The guard is deliberately this
# narrow rather than a blanket "no letter after the unit": a blanket guard
# would also stop flagging genuine missing spaces such as "2days" or "3dB".
# Every other ordinal suffix ("nd", "rd", "th") already fails to match
# because the digits are not immediately followed by a unit.
#
# Identifiers and decimal parameter counts are skipped as well:
#   - A trailing "_" ends the match, so "2d_regression" and "3d_segmentation"
#     (tutorial and file names) are not read as "2 d"/"3 d" days. Only the
#     underscore is guarded; "2days" still fires, because a blanket "no letter
#     after the unit" guard would also hide genuine missing spaces.
#   - A bare "B" preceded by "." is a decimal parameter count ("2.7B", "6.7B"),
#     the same shape as the hyphen case above.
#
# Severity is warning, not error. Whether "32GB" or "32 GB" is written is a
# house-style preference that writers cannot see in Markdown (the nonbreaking
# space is invisible), so it should not fail a build.
#
# Known limitation, not fixed: "0s"/"1s" meaning zeros and ones (e.g. "fill
# with 0s") is indistinguishable from a seconds value and still fires.
extends: existence
message: "CORE-020: Put a nonbreaking space between the number and the unit in '%s'."
link: "https://developers.google.com/style/units-of-measure"
nonword: true
level: warning
tokens:
  - '\b\d+(?:kB|MB|GB|TB)'
  - '(?<![-.])(?<!\d )\b\d+B\b'
  - '\b\d+(?:ns|ms|s(?!t\b)|min|h|d)(?!_)'
