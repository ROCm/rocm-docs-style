# CORE-008 — Sentence case for headings (error)
#
# Vale's `capitalization` with match: $sentence checks that a heading reads as
# a sentence (first word + proper nouns capitalized). The known limitation is
# proper nouns: Vale only treats a fixed `exceptions` list as "legitimately
# capitalized" words, so multi-word product names and unlisted proper nouns can
# still trip it.
#
# The proper nouns are NOT edited in this file. They are generated from
# wordlists/heading-proper-nouns.txt, which is shared with CORE-008-MD.yml so
# the Markdown and reStructuredText rules cannot drift apart. Edit that list,
# then run `python scripts/sync-heading-exceptions.py`; CI fails if the two
# are out of step. Names tagged `@md` in the list apply to Markdown only and
# are not emitted here. The patterns after the generated block are maintained
# by hand.
extends: capitalization
message: "CORE-008: Use sentence case for headings (capitalize only the first word and proper nouns)."
level: error
scope: heading
match: $sentence
exceptions:
