  # END GENERATED
  # Any word containing two or more capital letters is never a Title Case
  # violation (that produces exactly one capital, at the start of a word), so
  # it needs no per-name exception: all-caps acronyms (RDMA, NIC, CLI, PC),
  # model numbers (MI300X), and camelCase/mixed-case product and tool names
  # (XGBoost, CMake, WebUI, GitHub, MoRI). This mirrors the structural rule
  # in CORE-008-MD.yml. Without it every such word in an .rst heading was a
  # false positive.
  #
  # FRAGILE, do not "tidy" this pattern: how Vale prioritizes overlapping
  # exceptions is sensitive to the pattern's shape. The obvious spelling
  # `\w*[A-Z]\w*[A-Z]\w*` made it win over the listed phrase "ROCm Core SDK"
  # and flagged "Core"; `[A-Z][A-Za-z0-9]*[A-Z][A-Za-z0-9]*` broke ten of the
  # multi-word names above. This form passes them all. After changing the
  # pattern or adding a short multi-word exception, rerun
  # vale/testdata/core-008-rst-acronyms.rst, which includes each multi-word
  # exception that has a word the pattern does not cover.
  - '[A-Z]\w*[A-Z]\w*'
  # Any word that starts with a lowercase letter. A heading such as an API
  # identifier (`dynamic_dimension`, `parse_onnx`) is code, not a sentence,
  # and cannot be a Title Case violation. The cost is that a heading that
  # merely forgets to capitalize its first word ("getting started") is no
  # longer caught here either; that judgment is left to the review tier.
  # The leading \b matters: Vale matches exceptions as substrings, so without
  # it this would match the tail of "Configuring" and exempt every heading.
  - '\b[a-z]\w*'
