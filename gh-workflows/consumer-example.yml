# Consumer workflow. Copy this into a consuming repo's .github/workflows/.
#
# What it does:
#   1. Check out the consuming repo's PR content.
#   2. Check out the rocm-docs-style repo (the rules).
#   3. Download the latest Vale.
#   4. Sync the Google + Microsoft style packages.
#   5. Run the Vale check on the PR's changed files only.

name: rocm-docs-style-check

on:
  pull_request:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  vale:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out this repo's PR content
        uses: actions/checkout@v7
        with:
          fetch-depth: 0                       # needed to diff against base
          path: docs-repo

      - name: Check out the rocm-docs-style guide
        uses: actions/checkout@v7
        with:
          repository: ROCm/rocm-docs-style      # the public style-guide repo

      - name: Install Vale (latest)
        run: |
          curl -sS https://api.github.com/repos/vale-cli/vale/releases/latest \
            | jq '.assets[] | select(.name | contains("Linux_64-bit.tar.gz"))' \
            | jq '.browser_download_url' \
            | xargs wget -c {}
          sudo tar -xzf vale_*.tar.gz -C /usr/local/bin
          vale --version

      - name: Sync Google + Microsoft style packages
        run: |
          cd rocm-docs-style/vale
          vale sync            # downloads the Google/Microsoft packages referenced by .vale.ini

      - name: Vale-check the PR's changed Markdown
        run: |
          cd docs-repo # change this to actual path
          BASE="${{ github.event.pull_request.base.sha }}"
          FILES=$(git diff --name-only --diff-filter=ACM "$BASE" -- '*.md' '*.rst' || true)
          if [ -z "$FILES" ]; then
            echo "No changed docs to lint."
            exit 0
          fi
          echo "Linting changed files:"; echo "$FILES"
          # Use the style guide's config; lint files in THIS repo's checkout.
          vale --config="../rocm-docs-style/vale/.vale.ini" $FILES
