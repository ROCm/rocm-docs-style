# Consumer workflow. Copy this into a consuming repo's .github/workflows/.
#
# What it does:
#   1. Check out the consuming repo's PR content.
#   2. Check out the rocm-docs-style repo (the rules).
#   3. Download the latest Vale.
#   4. Sync the Google + Microsoft style packages.
#   5. Run the Vale check on the PR's changed Markdown and reStructuredText
#      files under docs/ only (see the pathspec in the last step to change that).

name: rocm-docs-style-check

on:
  pull_request:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  vale:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out this repo's PR content
        uses: actions/checkout@v7
        with:
          fetch-depth: 0                       # needed to diff against base
          path: docs-repo

      - name: Check out the rocm-docs-style guide
        uses: actions/checkout@v7
        with:
          repository: ROCm/rocm-docs-style      # the public style-guide repo
          path: rocm-docs-style                 # keep alongside docs-repo, not at workspace root

      - name: Install Vale (latest)
        run: |
          curl -sS -H "Authorization: Bearer ${{ github.token }}" \
            https://api.github.com/repos/vale-cli/vale/releases/latest \
            | jq -r '.assets[] | select(.name | contains("Linux_64-bit.tar.gz")) | .browser_download_url' \
            | xargs wget -c
          sudo tar -xzf vale_*.tar.gz -C /usr/local/bin
          vale --version

      - name: Sync Google + Microsoft style packages
        run: |
          cd rocm-docs-style/vale
          vale sync            # downloads the Google/Microsoft packages referenced by .vale.ini

      - name: Vale-check the PR's changed Markdown and reStructuredText
        run: |
          # This matches the `path: docs-repo` set on the first checkout step above.
          # If you change that `path:`, update this `cd` to match.
          cd docs-repo
          BASE="${{ github.event.pull_request.base.sha }}"
          # Only files under docs/ are linted by default (the plain pathspec's
          # '*' also matches across subdirectories, so docs/a/b.md is included).
          # Repo-level files such as CODE_OF_CONDUCT.md, issue and PR templates,
          # and third-party changelogs are intentionally NOT linted: they use a
          # different voice ("we", "please") that the style guide forbids in
          # product documentation, and in the first scan of whole repos they
          # produced roughly four in five of all alerts.
          #
          # If this repo's documentation lives elsewhere, add or change the
          # paths below, for example: -- 'docs/*.md' 'docs/*.rst' 'README.md'
          # To keep part of docs/ out of the check, add a pathspec such as
          # ':(exclude)docs/generated/*'.
          FILES=$(git diff --name-only --diff-filter=ACM "$BASE" -- 'docs/*.md' 'docs/*.rst' || true)
          if [ -z "$FILES" ]; then
            echo "No changed docs to lint."
            exit 0
          fi
          echo "Linting changed files:"; echo "$FILES"
          # Use the style guide's config; lint files in THIS repo's checkout.
          vale --config="../rocm-docs-style/vale/.vale.ini" $FILES
